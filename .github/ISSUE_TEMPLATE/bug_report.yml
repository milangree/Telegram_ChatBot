name: 🐞 Bug 报告
description: 报告可复现的缺陷，帮助尽快定位与修复
title: "[Bug] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索 [已有 issue](https://github.com/milangree/Telegram_ChatBot/issues?q=is%3Aissue) 避免重复。
        **安全漏洞请勿在此提交**，见 [SECURITY 说明](https://github.com/milangree/Telegram_ChatBot/blob/main/docs/SECURITY_REPORTING.md)。
        部署问题请附上部署形态（Cloudflare Pages / Docker / 本地 Node）。

  - type: dropdown
    id: deploy
    attributes:
      label: 部署形态
      description: 你是在哪种形态下遇到的问题？
      options:
        - Cloudflare Pages（Functions + KV/D1）
        - Cloudflare Pages + Hyperdrive（PostgreSQL/MySQL）
        - Docker / docker compose
        - 本地 Node（npm run server）
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: storage
    attributes:
      label: 存储后端（ACTIVE_DB）
      options:
        - kv
        - d1
        - hyperdrive (PostgreSQL)
        - hyperdrive (MySQL)
        - 未配置 / 不确定
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 镜像 tag、release 版本或 `git rev-parse --short HEAD` 输出
      placeholder: 例如 v2.0.0 或 0b9ea9d
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 问题现象
      description: 实际发生了什么？如果有报错，请贴完整错误文本。
      placeholder: |
        管理后台打开「用户管理」后列表一直空白；
        浏览器 Console 报 500，响应体 {"error":"..."}
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 应该正常渲染用户列表并支持分页。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从干净状态开始的最小步骤，越具体越好。
      placeholder: |
        1. 部署后访问 /login，用管理员登录
        2. 进入「用户管理」
        3. 点击第 2 页
        4. 列表空白，接口返回 500
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 请求响应
      description: |
        相关日志片段（服务端启动日志、Cloudflare Functions real-time logs、docker logs）。
        **请先删除 token、Bot Token、Cookie、密码、用户隐私内容。**
      render: shell

  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 浏览器与版本、操作系统、Node 版本（本地运行时）
      placeholder: Chrome 131 / macOS 15 / Node 22.11

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue，未发现重复
          required: true
        - label: 我已移除日志中的密钥、Token、Cookie 等敏感信息
          required: true
        - label: 该问题不是安全漏洞（安全漏洞走 SECURITY 流程）
          required: true
