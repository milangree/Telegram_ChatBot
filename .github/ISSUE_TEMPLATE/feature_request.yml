name: ✨ 功能建议
description: 提出新功能或改进现有行为
title: "[Feature] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        请先确认该功能不在 [README 功能列表](https://github.com/milangree/Telegram_ChatBot#-功能特性) 中，
        也没有重复的 issue。范围过大的想法欢迎先开 issue 讨论，再拆成可独立交付的小 PR。

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 消息转发 / 话题管理（bot-thread、webhook）
        - 验证系统（数学题 / 图片验证码 / Turnstile / reCAPTCHA / hCaptcha）
        - 存储层（KV / D1 / Hyperdrive）
        - 管理后台（用户、会话、设置、白名单）
        - 认证与安全（登录、2FA、审计日志、CORS）
        - 国际化 i18n
        - 部署（Cloudflare Pages / Docker / 镜像）
        - 文档与开发者体验
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景与痛点，而不是先给方案。谁在什么情况下会遇到？
      placeholder: |
        运营同学需要给一批用户群发通知，目前只能一个个私聊回复，耗时且易漏。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望的交互或行为。有 API / 配置形态的想法也写在这里。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 现有功能能否绕过？为什么不够用？

  - type: dropdown
    id: breaking
    attributes:
      label: 是否可能引入破坏性变更
      options:
        - 不会（纯新增）
        - 可能需要（改变现有行为或数据结构）
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现该功能（请先阅读 CONTRIBUTING.md）
        - label: 我可以提供测试环境配合验证
        - label: 我仅提出建议，暂不实现

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue，未发现重复
          required: true
