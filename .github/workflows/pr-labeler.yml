# PR 自动打标 — 按改动路径映射 scope/*、build、docs、security 等标签
# 依赖：.github/labeler.yml（路径规则）、.github/labels.yml（标签清单）
# 首次启用前先创建标签，见 docs/GITHUB_WORKFLOW.md。

name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: 按路径打标签
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
