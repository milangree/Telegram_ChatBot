# Telegram ChatBot — Docker Compose 配置
# 用法: docker compose up -d
#
# 环境变量说明:
#   PORT              - 服务端口（默认 3000）
#   KV_FILE           - KV 存储 SQLite 文件路径
#   D1_FILE           - D1 存储 SQLite 文件路径
#   DATABASE_URL      - PostgreSQL/MySQL 连接字符串（启用 Hyperdrive）
#   ACTIVE_DB         - 默认存储后端：kv / d1 / hyperdrive

services:
  telegram-chatbot:
    # 同时声明 image 与 build：本地源码重建，并沿用原镜像名，便于回滚
    image: kakuwari/tg-chatbot:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-chatbot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # 初始管理员账号（可选，仅首次启动有效）
      # 设置后使用指定密码创建初始管理员；未设置则自动生成并在日志中明文打印一次
      # - ADMIN_USERNAME=admin
      # - ADMIN_PASSWORD=your_secure_password
      # 可选：跨域管理后台白名单（逗号分隔）
      # - CORS_ORIGIN=https://admin.example.com
      # HTTPS 反代时开启 Cookie Secure
      # - COOKIE_SECURE=1
      # 存储配置 — 默认使用 KV（SQLite 文件）
      - KV_FILE=/app/data/kv-store.db
      - D1_FILE=/app/data/d1-store.db
      - ACTIVE_DB=${ACTIVE_DB:-kv}
      # 如需使用 PostgreSQL，取消注释以下行：
      # - DATABASE_URL=postgresql://user:password@postgres:5432/telegram_bot
      # - ACTIVE_DB=hyperdrive
    volumes:
      - telegram-chatbot-data:/app/data
    healthcheck:
      # 用 127.0.0.1 而非 localhost：容器内 localhost 优先解析为 IPv6 ::1，服务只监听 IPv4
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # ── 可选：PostgreSQL 后端（如需使用 Hyperdrive）────────────────────
  # 安全说明：
  #   - 本文件不提供任何默认数据库口令；未设置 POSTGRES_PASSWORD 时容器拒绝启动。
  #   - 默认不映射 5432 到宿主机（仅 compose 内部网络可达），避免数据库直接暴露。
  #   - 如需从本机调试，取消注释 ports 并仅绑定 127.0.0.1。
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: telegram-chatbot-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: telegram_bot
  #     POSTGRES_USER: telegram
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   # ports:
  #   #   - "127.0.0.1:5432:5432"

volumes:
  telegram-chatbot-data:
  # postgres-data:
